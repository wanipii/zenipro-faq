<script>

 {id:"pre",no:"1",name:"申請前・準備"},
 {id:"acct",no:"2",name:"アカウント設定"},
 {id:"tool",no:"3",name:"ツール設定"},
 {id:"res",no:"4",name:"リサーチ"},
 {id:"list",no:"5",name:"出品・広告"},
 {id:"sale",no:"6",name:"売れた後"},
 {id:"safe",no:"7",name:"トラブル・保全"},
 {id:"mind",no:"",name:"マインド"}
];
const DESC={
 pre:"書類、銀行、開業届、ChatWork、宿題など、始める前後で聞かれたこと。",
 acct:"セラーセントラルの設定まわりで出た疑問。",
 tool:"ZENIPROツールの設定で詰まったところ。",
 res:"簡易・精密リサーチの使い分けと、何を出すか。",
 list:"出品、GENERIC申請、広告、1日の作業の流れ。",
 sale:"注文が入ったあとの仕入れ、アカウントの分け方、送料。",
 safe:"アカウントが止まったときの話、スマホ作業のコツ。",
 mind:"手順ではなく、迷ったときに戻る考え方。いつ読んでもOK。"};
const FAQ=[
/* ---- 1 申請前 ---- */
{s:"pre",q:"Amazonセラー登録の住所確認書類は、何を出せばいい？",
 a:["運転免許証＋公共料金の領収書・請求書、または銀行の残高証明（PDF）で通った人が多い。",
 "免許証がない人は、パスポート＋住民票で即日通った例あり。住民票で住所が確認できたので、残高証明は求められなかった。",
 "クレカ明細（住所付きPDF）＋免許証、会社の登記簿謄本でも通っている。",
 "出てくる選択肢は人によって違う。スマホ料金の請求書が選べず、免許証だけで通った人もいる。",
 "審査は数時間〜1日が多い。メールが来なくても、ログインすると通っていることがある。"],k:"免許証 パスポート 住民票 登記簿 審査 本人確認"},
{s:"pre",q:"残高証明は、どの銀行で取ればいい？",
 a:["たくろーさんのテキストでも、三菱UFJが推奨。電話なしで証明書を取れる。楽天は面倒。",
 "残高が多い必要はなく、氏名と住所を確認するためのもの。",
 "三菱UFJは、申込から数時間で開設でき、翌日にPDFで残高証明を取れた。島根銀行など他行でもPDFが取れた例あり。",
 "自分名義の公共料金の請求書があれば、残高証明はなくても大丈夫。"],k:"三菱UFJ MUFG 楽天 口座 PDF"},
{s:"pre",q:"開業届は出すべき？ 扶養内のパートでも大丈夫？",
 a:["ぜにぴさん：「稼いだら開業届」ではなく、「開業届を出すから稼げる」。費用は0円で即日できて、参加費・月額・スマホ代も経費にできる。扶養に入っていても出せる。",
 "たくろーさんに確認：扶養内パートで、今後扶養を抜けて開業届を出す予定、という認識で契約・Amazon登録に進んで大丈夫。",
 "出したあとは、レシートと領収書をためる習慣だけでOK（ぜにぴさん）。",
 "メンバー談：開業前に買ったPCは開業費にできる場合がある／電気代・ネット代は事業で使う割合分／赤字は繰り越せる／副業が赤字でも確定申告で還付されることがある。",
 "税金のことは話半分で聞いて、税理士さんの情報で確認する。"],k:"開業届 扶養 経費 確定申告 税金 パート 専業主婦"},
{s:"pre",q:"契約書は事業者同士の契約みたい。開業届がなくても進めていい？",
 a:["たくろーさんに確認：開業届なしでも、契約書→Amazon登録と進めて大丈夫。",
 "失業手当をもらっている人は、ハローワークに状況を相談しながら進める。"],k:"契約書 サイン 失業手当 ハローワーク"},
{s:"pre",q:"家族名義で登録したい。すでにセラーアカウントを持っている。",
 a:["たくろーさんに確認：複数アカウントは、身分証・電話番号・端末・回線・メール・クレカ・銀行口座がすべて別でないとNG。1つでも同じだとダメ。",
 "今回は、夫名義で新規登録するのが手早くておすすめと案内された。",
 "家族分の登録は、自宅Wi-Fiや同じPCは使わず、その人のスマホでWi-Fiを切って行う。",
 "自宅Wi-Fiや自分の端末を使えるのは、初回ログイン後。手順はたくろーさんが改めて案内する。"],k:"複数アカウント 旦那 夫 家族 名義 Wi-Fi"},
{s:"pre",q:"申請中に出る質問（はい／いいえ）は、どう答える？",
 a:["たくろーさんに確認して、すべて「いいえ」で問題ないとの回答。",
 "「はい」で進めても通った人はいる。"],k:"はい いいえ 質問 申請"},
{s:"pre",q:"CSBA（有料サービス）の登録メールが届いた。どうする？",
 a:["購入者からの問い合わせをAmazonが代行する有料サービス。月額5,000円前後のものが自動で登録されることがある。",
 "基準内なら無料で使える、という情報もある。たくろーさんのPDFでは課金推奨だった。",
 "金額が違う（7,319円など）、または米国・カナダ・メキシコ宛のメールが出る場合は、海外アカウントができている可能性。",
 "続けるか解約するかは、ログ上では各自の判断（要確認）。"],k:"CSBA 5000円 課金 有料"},
{s:"pre",q:"ChatWorkがIDで検索できない。ログインできない。",
 a:["ID検索はできない。決済後に、参加者用LINEへ「決済しました！」と送ると、ChatWorkの案内が届く。",
 "LINEの友だち追加が表示されても進めないときは、時間を置くと追加できることがある。",
 "ChatWorkの名前が「〇〇（本名）さん」に編集されることがあるが、そのままでOK。"],k:"chatwork チャットワーク LINE 決済"},
{s:"pre",q:"申請が通らなかった（心当たりがない）。",
 a:["事例：本人が忘れている過去の出品アカウントに紐づいて、却下された。",
 "たくろーさんの助言で、経緯と異議をまとめてAmazon（社長宛）にメールしたところ、案件が動いて有効化された。",
 "別の道：パスポートなど別の書類で再申請／家族名義／アカウント購入（4〜5万円と案内）／別のスマホを用意して再申請。",
 "旧字体の氏名（髙など）は、照合に時間がかかることがある。"],k:"却下 申請不可 旧字体 社長 垢バン"},
{s:"pre",q:"申請が通ったあとの「宿題」「報告」の流れは？",
 a:["各章の感想をChatWorkで送る→マインド動画→目標と考え方の手書き課題を提出、という流れの人が多い。",
 "各章の感想は短くてOK（例：「2章ツール設定完了しました！次の章に入ります」）。",
 "動画のない章（06）は、「何も表示されていませんでした」と伝えればOK。",
 "宿題の提出後に追加の指示がなくても、「出品を進めます」と報告して進めてよい。",
 "出品を始めたら、夜に日報（今日意識したこと・進捗・警告対応）を送る。"],k:"宿題 日報 感想 報告 マインド動画 課題"},
/* ---- 2 アカウント設定 ---- */
{s:"acct",q:"海外アカウントの解約・返金で、サポート画面が先に進まない。",
 a:["「どのようなサポートが必要ですか？」欄の文字数を増やすと進めた、という報告あり。テキストに推奨の文章も追記されている。",
 "ログインするたびに米国表示になる人は、そのつど日本に切り替えている。",
 "11/19に、テキスト01へ海外アカウントの処理方法が追記された。",
 "解約でカードが止まったときは、カード会社に連絡して再開してもらう。カード会社が止めると請求はされなかった例もある（ドル建ての請求になるので注意）。"],k:"海外アカウント 解約 返金 米国 アメリカ カナダ 不正利用 サポート"},
{s:"acct",q:"すでに有在庫でAmazonアカウントを持っている。同じアカウントで無在庫もできる？",
 a:["同じアカウントで有在庫と無在庫を両方やろうとして、うまくいかず、ツール設定で止まった例がある（メンバーの体験談）。",
 "複数アカウントは、身分証・電話番号・端末・回線・メール・クレカ・銀行口座がすべて別でないとNG、とのたくろーさんの案内もある。",
 "長い目で見れば、焦らなくてよい。"],k:"有在庫 無在庫 同じアカウント 既存アカウント 持っている 物販経験"},
{s:"acct",q:"配送設定の「週末出荷」の画面が見つからない。",
 a:["出荷設定の右側「場所を表示」→アクション下の「編集」→配送料の横の「Edit」→画面の下に土日の選択が出る。",
 "スマホだと編集できないことがあるので、PCがおすすめ。",
 "たくろーさんに確認：週末出荷・祝日の変更欄は仕様変更で見つからないことがある。いったん気にしなくてOK。"],k:"配送設定 週末 土日 祝日 出荷"},
{s:"acct",q:"バーチャルオフィスはどこがいい？ みんなで同じ住所を使っていい？",
 a:["会社住所は、特商法の表記に出る。自宅近くの公園などだと、身バレのおそれがある。",
 "メンバー情報：GMOオフィスサポートが安い（月660円〜、半年無料のキャンペーンあり）。ハピタス経由でポイントがつく、紹介コードで割引、という情報もある。",
 "申込から審査完了まで、1日以内だった例。",
 "ぜにぴさんが1つ借りて全員で同じ住所にする案も出たが、避けたほうがよさそうという意見だった。"],k:"バーチャルオフィス GMO 会社住所 特商法 ハピタス"},
{s:"acct",q:"「正式名称」のページに、税務情報のメッセージが出た。",
 a:["国内のみの販売でも、通知が来たら手続きが必要。",
 "たくろーさんに確認：「普通に登録して終わりなのでOK」。氏名・住所等を入力し、署名ページへ進めば完了。"],k:"税務情報 正式名称 登録"},
/* ---- 3 ツール設定 ---- */
{s:"tool",q:"ZENIPROツールのログイン画面はどこ？",
 a:["ログイン画面：https://zenipro.blueash-tools.net/",
 "ページ上部のボタンからも開けます。",
 "最初に案内されたURLを開くとカード決済のページしか出ない、という質問があった。ログイン画面から入る。"],k:"ログイン URL ツール 画面 zenipro blueash 入り方"},
{s:"tool",q:"設定は何から進める？ 順番が知りたい。",
 a:["流れの一例：テキストサイトを見る→Amazon開設→ツール設定（できるところだけ）→たくろーさんに宿題を提出→出品。",
 "ツール設定の途中でも、章ごとの感想は送ってよい。"],k:"順番 流れ 進め方"},
{s:"tool",q:"「API連携2」のアカウントって何？ いつ必要？",
 a:["外注（サブ）用のアカウント。メインとは別のメールアドレスが必要。",
 "2アカウント運用の話ではなく、1アカウントのサブのような位置づけ。GENERIC申請V2などのオプションを使うときに動かす。",
 "オプションを使わないうちは設定不要。使う予定なら、先に別アドレスを作っておくとスムーズ。"],k:"API連携2 外注 サブアカウント 別アドレス"},
{s:"tool",q:"API連携2で詰まった（権限・QRコード・ログイン）。",
 a:["「ユニバーサルサイト管理者アクセス権の付与」が出ない → 「推奨情報を取得」で「管理者」を押すとチェックできる。",
 "追加アカウントの2段階認証QRのスクショを撮り忘れた → ①別のアドレスで招待し直す（Gmailの「＋01」のようなエイリアスでも可）②電話番号認証に変えてからQRに戻す③2段階認証を一度やめる。",

{s:"sale",q:"注文が入った。仕入れで迷ったところは？",
 a:["ASINでAmazon検索すると自分の出品が出てしまう。ツールの注文管理で「SKU」のリンクを押すと、仕入元の一覧が出る。そこで最安のものを買う。SKUの10桁の番号をコピーして検索しても買える。",
 "ChatWorkの購入通知に載っているURLから入ると、仕入れ元の商品に飛べて早い。",
 "購入者の住所・氏名は、セラセンの注文詳細で見られる。コピーして、仕入れ用アカウントの配送先にする。自分宛てのまま買いそうになる、という声あり。",
 "発送元が「Amazon Japan G.K.」でも、納品書の連絡は不要（たくろーさんの回答）。",

{s:"sale",q:"仕入れ元がAmazonではなく、「納品書を抜いてほしい」と伝えるには？",
 a:["PCの場合：自分の注文履歴→「注文内容を表示」→商品名のすぐ下にある、購入した店のリンクを押す→書いてあるメールアドレスなどへ送る。",
 "どの注文か分かるよう、注文番号も送る。お届け先が購入者なので、名前を名乗るより、注文番号で伝えるほうが確実。",
 "ペーパーレスの店は、そもそも納品書が入っていないという返事だった例もある。店のページに書いてあることもあるので、先に確認する。",
 "店の情報にメールアドレスがない場合：「ショップに質問する」を押すとAIが出てくる。「納品書を入れないでと伝えたい」と言うとAIがメールしてくれる。注文番号と納品書不要の旨を書くと、店から返信が来た。",
 "発送元がAmazon（Amazon.G.K含む）なら、納品書の連絡は不要。"],k:"納品書 抜いて 入れないで 注文番号 ペーパーレス 質問する AI メールアドレス Amazon以外 一般"},
{s:"sale",q:"仕入れ用のアカウントは、出品アカウントと分ける？",

 "切り替えが面倒なら、Chromeのプロファイルを分ける／仕入れはアプリ・出品はブラウザ、のように完全に分ける。",

{s:"sale",q:"仕入れ用のクレカはどうする？",
 a:["Amazonカード（ポイントがつく）がおすすめ。審査・発行は数分で済んだ例が多い。ブラックフライデーのキャンペーンで、発行ポイントが増えることも。",
 "家族名義で登録していても、仕入れ用のAmazonカードは自分名義でOK。",
 "事故例：新規アカウント＋新規クレカで、カード名義と違う宛先へ高額商品を送ろうとして、アカウントがロックされ、カードも止まった。",

{s:"sale",q:"送料で赤字にならないための注意は？",

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=s=>esc(s).replace(/https?:\/\/[^\s)）]+/g,u=>'<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
const norm=s=>s.toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
FAQ.forEach((f,i)=>{f.id="q"+i;f.hay=norm(f.q+" "+f.a.join(" ")+" "+(f.k||""));});

let stage="pre",query="";
const labelOf=S=>(S.no?S.no+". ":"")+S.name;
const ok=f=>query?query.split(/\s+/).every(w=>f.hay.includes(w)):true;

function buildTabs(){
  ["tabsTop","side"].forEach(id=>{
    const box=$(id);box.innerHTML="";
    const mk=(sid,label)=>{
      const b=document.createElement("button");b.type="button";b.className="tab";b.setAttribute("role","tab");b.dataset.id=sid;
      b.innerHTML='<span>'+esc(label)+'</span><span class="n"></span>';
      b.addEventListener("click",()=>setStage(sid));box.appendChild(b);
    };
    if(query)mk("all","検索結果");
    STAGES.forEach(S=>{
      if(S.id==="mind"&&id==="side"){const sp=document.createElement("div");sp.className="sep";box.appendChild(sp);}
      mk(S.id,labelOf(S));
    });
  });
}
function setStage(id){
  if(id!=="all"&&query){$("q").value="";query="";buildTabs();}
  stage=id;try{history.replaceState(null,"","#"+id)}catch(e){}
  render();window.scrollTo({top:0});
}
function article(f){
  return '<article id="'+f.id+'"><h3><i>Q</i><span>'+esc(f.q)+'</span></h3><ul>'+f.a.map(x=>'<li>'+fmt(x)+'</li>').join("")+'</ul></article>';
}
function render(){
  const searching=!!query;
  if(!searching&&stage==="all")stage="pre";
  const view=searching?"all":stage;
  document.querySelectorAll(".tab").forEach(b=>{
    const id=b.dataset.id;
    b.querySelector(".n").textContent=FAQ.filter(f=>ok(f)&&(id==="all"||f.s===id)).length;
    b.setAttribute("aria-selected",String(id===view));
    if(id===view&&b.closest(".tabs"))b.scrollIntoView({inline:"center",block:"nearest"});
  });
  $("clear").hidden=!searching;
  const list=FAQ.filter(f=>ok(f)&&(view==="all"||f.s===view));
  const m=$("main");
  if(!list.length){m.innerHTML='<div class="empty">該当する質問がありません。別のことばで探してみてください。</div>';return;}
  let h="";
  if(view==="all"){
    h+='<div class="stagehead"><h2>「'+esc($("q").value)+'」の検索結果 '+list.length+'件</h2><p>全部の段階から探して、段階ごとにまとめています。</p></div>';
    STAGES.forEach(S=>{
      const it=list.filter(f=>f.s===S.id);if(!it.length)return;
      h+='<section class="sgroup"><h2>'+esc(labelOf(S))+'</h2>'+it.map(article).join("")+'</section>';
    });
  }else{
    const S=STAGES.find(x=>x.id===view);
    h+='<div class="stagehead"><h2>'+esc(labelOf(S))+'</h2><p>'+esc(DESC[S.id])+'</p></div>';
    h+='<div class="idx"><b>この段階の質問（'+list.length+'件）</b><ol>'+list.map(f=>'<li><a href="#'+f.id+'" data-jump="'+f.id+'">'+esc(f.q)+'</a></li>').join("")+'</ol></div>';
    h+=list.map(article).join("");
    const i=STAGES.findIndex(x=>x.id===view),prev=STAGES[i-1],next=STAGES[i+1];
    h+='<div class="nav2"><span>'+(prev?'<button type="button" data-go="'+prev.id+'">← '+esc(labelOf(prev))+'</button>':"")+'</span><span>'+(next?'<button type="button" data-go="'+next.id+'">'+esc(labelOf(next))+' →</button>':"")+'</span></div>';
  }
  m.innerHTML=h;
  m.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>setStage(b.dataset.go)));
  m.querySelectorAll("[data-jump]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();const t=document.getElementById(a.dataset.jump);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});}));
}
$("q").addEventListener("input",e=>{const had=!!query;query=norm(e.target.value.trim());if(!!query!==had)buildTabs();render();});
$("clear").addEventListener("click",()=>{$("q").value="";query="";buildTabs();render();$("q").focus();});
const h0=(location.hash||"").slice(1);if(STAGES.some(s=>s.id===h0))stage=h0;
buildTabs();render();
</script>
